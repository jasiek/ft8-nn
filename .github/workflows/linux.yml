# Linux build + tests (x64 and aarch64). The recordings are not in this repository, so the C-vs-Python check runs the
# trained model (models/v3) on synthetic slots (tools/ci_smoke.py); the full golden tests on real recordings run
# locally (tools/validate_full.sh).
name: linux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: WSJT-X (ft8code for the encoder and message tests; they skip without it)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends wsjtx
        continue-on-error: true

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: ONNX Runtime (official release)
        run: tools/get_onnxruntime.sh

      - name: Build libft8nn
        run: make -C c

      - name: Python tests
        run: uv run pytest -q -rs

      - name: C vs Python on synthetic slots
        run: uv run python tools/ci_smoke.py

      # WSJT-X's external FT8 decoder (wsjtx/): driven through the whole protocol -- hello, a decode
      # request with its audio, the replies, a re-decode, quit -- by wsjtx/fake_wsjtx, on the slots
      # the step above wrote.
      - name: WSJT-X FT8 sidecar
        run: env TEST_SHIM_SLOTS="$PWD/data/ci/rec/synthetic/slots" make -C wsjtx test NSLOTS=2
